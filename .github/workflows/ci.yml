name: ARVELIS CI

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
  push:
    branches:
      - 'codex/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Runtime info
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Plan orchestration business and provenance
        run: npm run test:plan-policy

      - name: Production transport search contract
        run: npm run test:transport-search-contract

      - name: Location resolution foundation
        run: npm run test:location-resolution-foundation

      - name: Location directory persistence and ranking foundation
        run: npm run test:location-directory-foundation

      - name: SQLite location directory persistence
        run: npm run test:location-directory-sqlite

      - name: GeoNames location source contract
        run: npm run test:geonames-location-source

      - name: GeoNames controlled ingestion evaluation
        run: npm run test:geonames-controlled-ingestion-eval

      - name: GeoNames controlled directory import
        run: npm run test:geonames-controlled-directory-import

      - name: Transport contract business and freshness
        run: npm run test:transport-policy

      - name: Transport provider strategy plus Map and Legal foundations
        run: npm run test:transport-provider-foundation

      - name: ARVELIS AI Engine and Knowledge Foundation
        run: npm run test:ai-knowledge-foundation

      - name: Retrieval and Knowledge Ingestion Foundation
        run: npm run test:retrieval-knowledge-foundation

      - name: Qwen Runtime Adapter and AI Evaluation
        run: npm run test:qwen-runtime-evaluation

      - name: Free Local Qwen llama.cpp Adapter
        run: npm run test:qwen-llamacpp-runtime

      - name: Yandex Rasp live adapter HTTP and freshness
        run: npm run test:yandex-rasp-live

      - name: Trip server business and ownership
        run: npm run test:trip-server

      - name: Server runtime build
        run: npm run build:auth-server

      - name: Server-backed Travel browser happy-path
        run: npm run test:travel-browser

      - name: Frontend build
        run: npm run build

      - name: Full npm check checkpoint
        run: npm run check

  postgres-compat:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: arvelis_test
          POSTGRES_USER: arvelis
          POSTGRES_PASSWORD: arvelis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvelis -d arvelis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arvelis:arvelis_test_password@127.0.0.1:5432/arvelis_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: PostgreSQL migrations
        run: npm run db:migrate

      - name: PostgreSQL Trip persistence and ownership
        run: npm run test:trip-postgres

      - name: PostgreSQL pgvector Knowledge isolation and retrieval
        run: npm run test:knowledge-postgres-foundation

      - name: PostgreSQL location directory persistence
        run: npm run test:location-directory-postgres

  geonames-real-directory-qualification:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/travel-geonames-real-directory-qualification-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download and validate official RU dump ephemerally
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          python3 - "$workdir" <<'PY'
          import hashlib
          import json
          import stat
          import sys
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          url = 'https://download.geonames.org/export/dump/RU.zip'
          max_archive_bytes = 32 * 1024 * 1024
          max_member_bytes = 512 * 1024 * 1024
          max_total_uncompressed_bytes = 520 * 1024 * 1024
          max_members = 10
          workdir = Path(sys.argv[1])
          archive_path = workdir / 'RU.zip'
          tsv_path = workdir / 'RU.txt'
          manifest_path = workdir / 'manifest.json'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('redirect_not_allowed')

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(
              url,
              headers={'User-Agent': 'ARVELIS-AI-GeoNames-Directory-Evidence/1.0'},
          )
          sha256 = hashlib.sha256()
          archive_bytes = 0
          with opener.open(request, timeout=30) as response:
              if response.status != 200 or response.geturl() != url:
                  raise RuntimeError('unexpected_http_response')
              content_length = response.headers.get('Content-Length')
              if content_length is not None and int(content_length) > max_archive_bytes:
                  raise RuntimeError('archive_too_large')
              last_modified = response.headers.get('Last-Modified')
              if not last_modified:
                  raise RuntimeError('missing_last_modified')
              with archive_path.open('wb') as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      archive_bytes += len(chunk)
                      if archive_bytes > max_archive_bytes:
                          raise RuntimeError('archive_too_large')
                      sha256.update(chunk)
                      output.write(chunk)

          if archive_bytes < 1:
              raise RuntimeError('empty_archive')

          safe_member_evidence = []
          with zipfile.ZipFile(archive_path, 'r') as archive:
              members = archive.infolist()
              if not members or len(members) > max_members:
                  raise RuntimeError('unexpected_zip_members')

              target_members = []
              total_uncompressed_bytes = 0
              for member in members:
                  name = member.filename
                  mode = (member.external_attr >> 16) & 0xFFFF
                  if not name or name in {'.', '..'} or member.is_dir() or '/' in name or '\\' in name:
                      raise RuntimeError('unsafe_zip_member')
                  if mode and stat.S_ISLNK(mode):
                      raise RuntimeError('symlink_not_allowed')
                  if member.file_size < 0 or member.file_size > max_member_bytes:
                      raise RuntimeError('member_size_out_of_bounds')
                  total_uncompressed_bytes += member.file_size
                  if total_uncompressed_bytes > max_total_uncompressed_bytes:
                      raise RuntimeError('archive_uncompressed_size_out_of_bounds')
                  safe_member_evidence.append({'name': name, 'bytes': member.file_size})
                  if name == 'RU.txt':
                      target_members.append(member)

              if len(target_members) != 1 or target_members[0].file_size < 1:
                  raise RuntimeError('ru_member_missing_or_ambiguous')

              member = target_members[0]
              extracted_bytes = 0
              with archive.open(member, 'r') as source, tsv_path.open('wb') as output:
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      extracted_bytes += len(chunk)
                      if extracted_bytes > max_member_bytes:
                          raise RuntimeError('member_size_out_of_bounds')
                      output.write(chunk)

          source_modified_date = parsedate_to_datetime(last_modified).date().isoformat()
          retrieved_at = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          manifest = {
              'version': 1,
              'source': 'geonames',
              'countryCode': 'RU',
              'archiveUrl': url,
              'archiveSha256': sha256.hexdigest(),
              'archiveBytes': archive_bytes,
              'sourceModifiedDate': source_modified_date,
              'retrievedAt': retrieved_at,
              'license': 'CC-BY-4.0',
              'attributionUrl': 'https://www.geonames.org/',
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False), encoding='utf-8')

          provenance = {
              **manifest,
              'archiveMemberCount': len(safe_member_evidence),
              'archiveMembers': safe_member_evidence,
              'evaluatedMember': 'RU.txt',
              'evaluatedMemberBytes': extracted_bytes,
              'rawDataPersisted': False,
              'artifactUploaded': False,
          }
          print('GEONAMES_RU_IMPORT_PROVENANCE=' + json.dumps(provenance, ensure_ascii=False, sort_keys=True))
          PY

          npm run eval:geonames-real-directory -- "$workdir/RU.txt" "$workdir/manifest.json"

          rm -rf "$workdir"
          trap - EXIT

