name: ARVELIS CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Runtime info
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Auth core smoke
        run: npm run test:auth

      - name: Server email OTP smoke
        run: npm run test:server-auth

      - name: SQLite auth persistence smoke
        run: npm run test:server-sqlite

      - name: Auth server runtime build
        run: npm run build:auth-server

      - name: Build
        run: npm run build

  postgres-compat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: arvelis_test
          POSTGRES_USER: arvelis
          POSTGRES_PASSWORD: arvelis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvelis -d arvelis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arvelis:arvelis_test_password@127.0.0.1:5432/arvelis_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: PostgreSQL auth migration
        run: npm run db:migrate

      - name: PostgreSQL auth persistence smoke
        run: npm run test:server-db
