name: ARVELIS CI

on:
  pull_request:
    branches: [main, feat/travel-foundation-v1, feat/travel-ui-redesign-v2]
  push:
    branches:
      - 'codex/**'
      - 'feat/travel-ui-redesign-v2'
      - 'feat/travel-trip-persistence-v1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Refresh lock for security patch
        shell: bash
        run: |
          if grep -q '"nodemailer": "9.0.5"' package-lock.json; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): lock nodemailer 9.1.1"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Runtime info
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Trip server business and ownership
        run: npm run test:trip-server

      - name: Server runtime build
        run: npm run build:auth-server

      - name: Server-backed Travel browser happy-path
        run: npm run test:travel-browser

      - name: Frontend build
        run: npm run build

  postgres-compat:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: arvelis_test
          POSTGRES_USER: arvelis
          POSTGRES_PASSWORD: arvelis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvelis -d arvelis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arvelis:arvelis_test_password@127.0.0.1:5432/arvelis_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: PostgreSQL migrations
        run: npm run db:migrate

      - name: PostgreSQL Trip persistence and ownership
        run: npm run test:trip-postgres
